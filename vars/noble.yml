---
# PostgreSQL vars for Ubuntu Noble Numbat (24.04LTS)

postgresql_ext_postgis_deps:
  - libgeos-c1v5
  - "{{ postgresql_package_prefix }}postgresql-{{postgresql_version}}-postgis-{{postgresql_ext_postgis_version}}"
  - "{{ postgresql_package_prefix }}postgresql-{{postgresql_version}}-postgis-{{postgresql_ext_postgis_version}}-scripts"

postgresql_fdw_mysql_packages: "postgresql-{{ postgresql_version }}-mysql-fdw"
postgresql_fdw_ogr_packages: "postgresql-{{ postgresql_version }}-ogr-fdw"
